<script>
(function () {
  var box = document.getElementById("dir-slideshow");
  if (!box) return;
  var slides = box.querySelectorAll(".dir-slide");
  if (slides.length < 2) return;
  var i = 0;
  setInterval(function () {
    slides[i].classList.remove("is-active");
    i = (i + 1) % slides.length;
    slides[i].classList.add("is-active");
  }, 3000);
})();
</script>
